<svg width="1600" height="900" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F33"/>
      <stop offset="55%" stop-color="#071019"/>
      <stop offset="100%" stop-color="#050C13"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3DDC84" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CF2BA"/>
      <stop offset="100%" stop-color="#1E9E5C"/>
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#7FA6B0" opacity="0.16"/>
    </pattern>
    <clipPath id="canvasClip">
      <rect width="1200" height="630" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <rect width="1200" height="630" fill="url(#bgGrad)"/>
    <rect width="1200" height="630" fill="url(#dotGrid)"/>
    <circle cx="940" cy="300" r="330" fill="url(#glowGreen)"/>

    <!-- Android head motif -->
    <g>
      <path d="M 820 300 A 120 120 0 0 1 1060 300 Z" fill="#3DDC84" fill-opacity="0.92"/>
      <line x1="871" y1="202" x2="858" y2="166" stroke="#3DDC84" stroke-width="9" stroke-linecap="round"/>
      <line x1="1009" y1="202" x2="1022" y2="166" stroke="#3DDC84" stroke-width="9" stroke-linecap="round"/>
      <circle cx="900" cy="258" r="13" fill="#071019"/>
      <circle cx="980" cy="258" r="13" fill="#071019"/>
    </g>

    <!-- ghosted code line -->
    <text x="440" y="604" font-family="JetBrains Mono, Fira Code, monospace" font-size="28"
          fill="#7FA6B0" fill-opacity="0.14" letter-spacing="1">
      setContentView(R.layout.activity_main);
    </text>

    <!-- left column -->
    <rect x="80" y="92" width="46" height="6" rx="3" fill="#F5A94E"/>
    <text x="80" y="136" font-family="Poppins, Inter, sans-serif" font-size="22" font-weight="700"
          letter-spacing="3" fill="#F5A94E">ENAM NOTES</text>
    <text x="80" y="164" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="20" fill="#7FA6B0">ব্লগ • Android App Development</text>

    <text x="78" y="250" font-family="Poppins, Inter, sans-serif"
          font-size="46" font-weight="700" fill="#F3F7F8">Android App Development</text>
    <text x="78" y="308" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="46" font-weight="700" fill="url(#accentGrad)">সম্পূর্ণ বাংলা গাইড</text>

    <text x="80" y="352" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="21" fill="#9FB8C2">Java/XML · Activity · Manifest · SQLite · অ্যাপ প্রকাশ</text>

    <!-- free-lesson badge + label, bottom-left -->
    <g transform="translate(80, 476)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#3DDC84"/>
      <text x="28" y="39" text-anchor="middle" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
            font-size="24" font-weight="700" fill="#071019">৩২</text>
      <text x="74" y="27" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="22" font-weight="600"
            fill="#F3F7F8">৩২টি ফ্রি লেসন</text>
      <text x="74" y="54" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
            font-size="18" fill="#7FA6B0">বাংলায়, বিগিনারদের জন্য</text>
    </g>

    <!-- site url -->
    <text x="1120" y="566" text-anchor="end" font-family="Poppins, Inter, sans-serif" font-size="18"
          letter-spacing="1" fill="#5A7986">enamnotes.com</text>

    <rect x="0" y="0" width="1200" height="4" fill="#3DDC84" fill-opacity="0.6"/>
  </g>
</svg>
