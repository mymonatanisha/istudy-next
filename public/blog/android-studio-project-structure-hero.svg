      <text x="74" y="27" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="22" font-weight="600"
            fill="#F3F7F8">রোডম্যাপের ৪ নম্বর ধাপ</text>
      <text x="74" y="54" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
            font-size="18" fill="#7FA6B0">বাংলায়, বিগিনারদের জন্য</text>
    </g>

    <text x="1120" y="566" text-anchor="end" font-family="Poppins, Inter, sans-serif" font-size="18"
          letter-spacing="1" fill="#5A7986">enamnotes.com</text>
    <rect x="0" y="0" width="1200" height="4" fill="#3DDC84" fill-opacity="0.6"/>
  </g>
</svg>
