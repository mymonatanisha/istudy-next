<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">App development learning roadmap</title><desc id="desc">Six-step roadmap from development environment and programming fundamentals to publishing and maintaining apps.</desc><rect width="1400" height="900" rx="36" fill="#f7fbf9"/><text x="700" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#063b2d">App Development Learning Roadmap</text><text x="700" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#4b7568">Build skills in layers instead of trying to learn everything at once.</text><g font-family="Arial, sans-serif"><rect x="100" y="175" width="1200" height="92" rx="22" fill="#d9f2e8"/><text x="145" y="215" font-size="18" font-weight="700" fill="#0b8f67">01</text><text x="205" y="216" font-size="28" font-weight="700" fill="#063b2d">Development Environment</text><text x="205" y="247" font-size="18" fill="#4b7568">IDE, SDK, emulator/device, project structure</text><rect x="100" y="300" width="1200" height="92" rx="22" fill="#e3f5ee"/><text x="145" y="340" font-size="18" font-weight="700" fill="#0b8f67">02</text><text x="205" y="341" font-size="28" font-weight="700" fill="#063b2d">Programming Fundamentals</text><text x="205" y="372" font-size="18" fill="#4b7568">Variables, conditions, loops, functions, classes, problem solving</text><rect x="100" y="425" width="1200" height="92" rx="22" fill="#d9f2e8"/><text x="145" y="465" font-size="18" font-weight="700" fill="#0b8f67">03</text><text x="205" y="466" font-size="28" font-weight="700" fill="#063b2d">UI &amp; App Architecture</text><text x="205" y="497" font-size="18" fill="#4b7568">Screens, navigation, state, reusable components, responsive UI</text><rect x="100" y="550" width="1200" height="92" rx="22" fill="#e3f5ee"/><text x="145" y="590" font-size="18" font-weight="700" fill="#0b8f67">04</text><text x="205" y="591" font-size="28" font-weight="700" fill="#063b2d">APIs &amp; Database</text><text x="205" y="622" font-size="18" fill="#4b7568">Networking, authentication, backend APIs, persistent data</text><rect x="100" y="675" width="580" height="92" rx="22" fill="#d9f2e8"/><text x="145" y="715" font-size="18" font-weight="700" fill="#0b8f67">05</text><text x="205" y="716" font-size="28" font-weight="700" fill="#063b2d">Real Projects</text><text x="205" y="747" font-size="18" fill="#4b7568">Build, debug, iterate, document</text><rect x="720" y="675" width="580" height="92" rx="22" fill="#063b2d"/><text x="765" y="715" font-size="18" font-weight="700" fill="#9ee2cc">06</text><text x="825" y="716" font-size="28" font-weight="700" fill="#ffffff">Publish &amp; Maintain</text><text x="825" y="747" font-size="18" fill="#c8efe1">Testing, release, security, performance</text></g></svg>