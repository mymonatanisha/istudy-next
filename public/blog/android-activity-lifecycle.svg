<svg width="1200" height="675" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F33"/><stop offset="55%" stop-color="#071019"/><stop offset="100%" stop-color="#050C13"/>
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#7FA6B0" opacity="0.14"/>
    </pattern>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3DDC84"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5A94E"/>
    </marker>
    <clipPath id="canvasClip"><rect width="1200" height="675" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <rect width="1200" height="675" fill="url(#bgGrad)"/>
    <rect width="1200" height="675" fill="url(#dotGrid)"/>

    <rect x="80" y="46" width="46" height="6" rx="3" fill="#F5A94E"/>
    <text x="80" y="96" font-family="Poppins, Inter, sans-serif"
          font-size="32" font-weight="700" fill="#F3F7F8">Activity Lifecycle</text>
    <text x="80" y="128" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="18" fill="#9FB8C2">একটি পর্দার জন্ম থেকে মৃত্যু পর্যন্ত Android নিজেই যে ধাপগুলো ডাকে</text>

    <!-- main chain -->
    <g>
      <rect x="200" y="164" width="330" height="58" rx="10" fill="#3DDC84" fill-opacity="0.95"/>
      <text x="222" y="188" font-family="JetBrains Mono, Fira Code, monospace" font-size="17" font-weight="700" fill="#071019">onCreate()</text>
      <text x="222" y="210" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="14" fill="#0B2E22">জন্ম — লেআউট সেট, সব প্রস্তুতি</text>

      <rect x="200" y="236" width="330" height="58" rx="10" fill="#3DDC84" fill-opacity="0.78"/>
      <text x="222" y="260" font-family="JetBrains Mono, Fira Code, monospace" font-size="17" font-weight="700" fill="#071019">onStart()</text>
      <text x="222" y="282" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="14" fill="#0B2E22">দৃশ্যমান হচ্ছে, এখনো স্পর্শ করা যায় না</text>

      <rect x="200" y="308" width="330" height="58" rx="10" fill="#8CF2BA"/>
      <text x="222" y="332" font-family="JetBrains Mono, Fira Code, monospace" font-size="17" font-weight="700" fill="#071019">onResume()</text>
      <text x="222" y="354" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="14" fill="#0B2E22">পুরোপুরি সামনে — ব্যবহারকারী কাজ করছেন</text>

      <rect x="200" y="380" width="330" height="58" rx="10" fill="#F5A94E" fill-opacity="0.9"/>
      <text x="222" y="404" font-family="JetBrains Mono, Fira Code, monospace" font-size="17" font-weight="700" fill="#071019">onPause()</text>
      <text x="222" y="426" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="14" fill="#3D2600">কিছু সামনে এসেছে — কাজ সাময়িক থামে</text>

      <rect x="200" y="452" width="330" height="58" rx="10" fill="#F5A94E" fill-opacity="0.62"/>
      <text x="222" y="476" font-family="JetBrains Mono, Fira Code, monospace" font-size="17" font-weight="700" fill="#071019">onStop()</text>
      <text x="222" y="498" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="14" fill="#3D2600">আর দেখা যাচ্ছে না, পেছনে চলে গেছে</text>

      <rect x="200" y="524" width="330" height="58" rx="10" fill="#FF6B6B" fill-opacity="0.85"/>
      <text x="222" y="548" font-family="JetBrains Mono, Fira Code, monospace" font-size="17" font-weight="700" fill="#071019">onDestroy()</text>
      <text x="222" y="570" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="14" fill="#3D0000">পর্দার শেষ — সংযোগ বন্ধ করার সময়</text>
    </g>

    <!-- down arrows -->
    <g stroke="#3DDC84" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" opacity="0.8">
      <line x1="365" y1="222" x2="365" y2="232"/>
      <line x1="365" y1="294" x2="365" y2="304"/>
    </g>
    <g stroke="#F5A94E" stroke-width="3" fill="none" marker-end="url(#arrowAmber)" opacity="0.8">
      <line x1="365" y1="366" x2="365" y2="376"/>
      <line x1="365" y1="438" x2="365" y2="448"/>
      <line x1="365" y1="510" x2="365" y2="520"/>
    </g>

    <!-- onRestart side lane -->
    <rect x="700" y="452" width="330" height="58" rx="10" fill="none" stroke="#3DDC84" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="722" y="476" font-family="JetBrains Mono, Fira Code, monospace" font-size="17" font-weight="700" fill="#8CF2BA">onRestart()</text>
    <text x="722" y="498" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="14" fill="#9FB8C2">পেছনের পর্দা আবার সামনে আসছে</text>

    <path d="M 534 481 L 696 481" stroke="#3DDC84" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#arrowGreen)"/>
    <path d="M 1034 452 L 1034 265 L 534 265" stroke="#3DDC84" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#arrowGreen)"/>

    <!-- note -->
    <rect x="700" y="164" width="414" height="128" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#7FA6B0" stroke-opacity="0.35" stroke-width="2"/>
    <text x="722" y="196" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="16" font-weight="700" fill="#8CF2BA">মঞ্চ-অভিনেতার উপমা</text>
    <text x="722" y="224" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="14" fill="#9FB8C2">onCreate — মেকআপঘরে সাজ</text>
    <text x="722" y="247" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="14" fill="#9FB8C2">onStart — পর্দার আড়ালে দাঁড়ানো</text>
    <text x="722" y="270" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="14" fill="#9FB8C2">onResume — মঞ্চে, সবাই দেখছে</text>

    <rect x="700" y="308" width="414" height="118" rx="12" fill="#F5A94E" fill-opacity="0.10" stroke="#F5A94E" stroke-opacity="0.45" stroke-width="2"/>
    <text x="722" y="340" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="16" font-weight="700" fill="#F5A94E">কোথায় কোন কাজ লিখবেন</text>
    <text x="722" y="368" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="14" fill="#F3F7F8">সংযোগ খোলা → onCreate</text>
    <text x="722" y="391" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="14" fill="#F3F7F8">ইনপুট সংরক্ষণ → onPause</text>
    <text x="722" y="414" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="14" fill="#F3F7F8">সংযোগ বন্ধ → onDestroy</text>

    <rect x="0" y="0" width="1200" height="4" fill="#3DDC84" fill-opacity="0.6"/>
  </g>
</svg>
