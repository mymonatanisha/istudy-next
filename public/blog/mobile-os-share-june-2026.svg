<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Worldwide mobile operating system share June 2026</title><desc id="desc">Android 68.45 percent and iOS 31.42 percent, based on StatCounter Global Stats worldwide mobile, tablet and console operating-system share for June 2026.</desc><rect width="1400" height="760" rx="36" fill="#ffffff"/><text x="700" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#063b2d">Worldwide Mobile OS Share — June 2026</text><text x="700" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#55796e">Mobile, tablet and console operating-system share</text><line x1="210" y1="620" x2="1250" y2="620" stroke="#9abbb0" stroke-width="3"/><line x1="210" y1="180" x2="210" y2="620" stroke="#9abbb0" stroke-width="3"/><g font-family="Arial, sans-serif" fill="#6b8a81" font-size="16"><text x="190" y="625" text-anchor="end">0%</text><text x="190" y="515" text-anchor="end">25%</text><text x="190" y="405" text-anchor="end">50%</text><text x="190" y="295" text-anchor="end">75%</text><text x="190" y="185" text-anchor="end">100%</text></g><g stroke="#dcebe6" stroke-width="2"><line x1="210" y1="510" x2="1250" y2="510"/><line x1="210" y1="400" x2="1250" y2="400"/><line x1="210" y1="290" x2="1250" y2="290"/><line x1="210" y1="180" x2="1250" y2="180"/></g><rect x="390" y="319" width="230" height="301" rx="18" fill="#0b8f67"/><rect x="790" y="482" width="230" height="138" rx="18" fill="#6aa99a"/><g font-family="Arial, sans-serif" text-anchor="middle"><text x="505" y="285" font-size="34" font-weight="700" fill="#063b2d">68.45%</text><text x="505" y="665" font-size="26" font-weight="700" fill="#063b2d">Android</text><text x="905" y="448" font-size="34" font-weight="700" fill="#063b2d">31.42%</text><text x="905" y="665" font-size="26" font-weight="700" fill="#063b2d">iOS</text></g><text x="700" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#718c84">Source: StatCounter Global Stats, Worldwide, June 2026.</text></svg>