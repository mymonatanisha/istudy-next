<svg width="1600" height="900" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F33"/>
      <stop offset="55%" stop-color="#071019"/>
      <stop offset="100%" stop-color="#050C13"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3D9" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#22D3D9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5FEFF4"/>
      <stop offset="100%" stop-color="#159AA0"/>
    </linearGradient>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#7FA6B0" opacity="0.16"/>
    </pattern>

    <clipPath id="canvasClip">
      <rect width="1200" height="630" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- base background -->
    <rect width="1200" height="630" fill="url(#bgGrad)"/>
    <rect width="1200" height="630" fill="url(#dotGrid)"/>

    <!-- ambient glow -->
    <circle cx="940" cy="300" r="320" fill="url(#glowCyan)"/>

    <!-- background signature motif: widget tree -->
    <g stroke="#22D3D9" stroke-opacity="0.22" stroke-width="2" fill="none">
      <line x1="820" y1="120" x2="820" y2="185"/>
      <line x1="820" y1="185" x2="720" y2="250"/>
      <line x1="820" y1="185" x2="920" y2="250"/>
      <line x1="720" y1="250" x2="660" y2="320"/>
      <line x1="720" y1="250" x2="765" y2="320"/>
      <line x1="920" y1="250" x2="880" y2="320"/>
      <line x1="920" y1="250" x2="990" y2="320"/>
    </g>
    <g fill="#22D3D9" fill-opacity="0.85">
      <rect x="808" y="100" width="24" height="24" rx="6"/>
      <rect x="708" y="238" width="24" height="24" rx="6"/>
      <rect x="908" y="238" width="24" height="24" rx="6"/>
    </g>
    <g fill="#F5A94E" fill-opacity="0.8">
      <rect x="648" y="308" width="20" height="20" rx="5"/>
      <rect x="753" y="308" width="20" height="20" rx="5"/>
      <rect x="868" y="308" width="20" height="20" rx="5"/>
      <rect x="978" y="308" width="20" height="20" rx="5"/>
    </g>

    <!-- ghosted code line -->
    <text x="520" y="600" font-family="JetBrains Mono, Fira Code, monospace" font-size="30"
          fill="#7FA6B0" fill-opacity="0.14" letter-spacing="1">
      runApp(const FlutterGuide());
    </text>

    <!-- ===== left column: eyebrow + headline ===== -->
    <rect x="80" y="92" width="46" height="6" rx="3" fill="#F5A94E"/>
    <text x="80" y="136" font-family="Poppins, Inter, sans-serif" font-size="22" font-weight="700"
          letter-spacing="3" fill="#F5A94E">ENAM NOTES</text>
    <text x="80" y="164" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="20" fill="#7FA6B0">ব্লগ • Flutter App Development</text>

    <text x="78" y="250" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="48" font-weight="700" fill="#F3F7F8">Flutter App Development</text>
    <text x="78" y="312" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="48" font-weight="700" fill="url(#accentGrad)">শেখার সম্পূর্ণ গাইড</text>

    <text x="80" y="358" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="24" fill="#9FB8C2">Dart থেকে Play Store পর্যন্ত — ২০২৬ সালের রোডম্যাপ</text>

    <!-- flutter mark + label, bottom-left -->
    <g transform="translate(80, 480)">
      <path d="M4 0 L34 30 L20 44 L-10 14 Z" fill="#22D3D9"/>
      <path d="M14 24 L34 44 L20 58 L0 40 Z" fill="#F5A94E"/>
      <text x="56" y="24" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="22" font-weight="600"
            fill="#F3F7F8">শুরু থেকে অ্যাপ পাবলিশ পর্যন্ত</text>
      <text x="56" y="50" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
            font-size="18" fill="#7FA6B0">বাংলায়, বিগিনারদের জন্য</text>
    </g>

    <!-- ===== right side: hero word ===== -->
    <text x="1120" y="300" text-anchor="end" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="120" font-weight="700" fill="url(#accentGrad)">Dart</text>
    <rect x="905" y="322" width="215" height="8" rx="4" fill="#F5A94E"/>
    <text x="1120" y="368" text-anchor="end" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="24" fill="#DCE9EC">এক কোডবেস, সব প্ল্যাটফর্ম</text>
    <text x="1120" y="400" text-anchor="end" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="18" fill="#7FA6B0">Android • iOS • Web • Desktop</text>

    <!-- site url, bottom-right -->
    <text x="1120" y="566" text-anchor="end" font-family="Poppins, Inter, sans-serif" font-size="18"
          letter-spacing="1" fill="#5A7986">enamnotes.com</text>

    <!-- top hairline accent -->
    <rect x="0" y="0" width="1200" height="4" fill="#22D3D9" fill-opacity="0.6"/>
  </g>
</svg>
