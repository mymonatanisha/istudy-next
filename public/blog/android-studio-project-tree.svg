<svg width="1200" height="675" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F33"/><stop offset="55%" stop-color="#071019"/><stop offset="100%" stop-color="#050C13"/>
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#7FA6B0" opacity="0.14"/>
    </pattern>
    <clipPath id="canvasClip"><rect width="1200" height="675" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <rect width="1200" height="675" fill="url(#bgGrad)"/>
    <rect width="1200" height="675" fill="url(#dotGrid)"/>

    <rect x="80" y="52" width="46" height="6" rx="3" fill="#F5A94E"/>
    <text x="80" y="104" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="34" font-weight="700" fill="#F3F7F8">Android Studio প্রজেক্ট স্ট্রাকচার</text>
    <text x="80" y="136" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="18" fill="#9FB8C2">app ফোল্ডারের ভেতরেই অ্যাপের সবকিছু — বাকিগুলো সেটিংস ও নির্মাণের ফাইল</text>

    <!-- level 0 -->
    <rect x="90" y="176" width="1000" height="46" rx="10" fill="#3DDC84" fill-opacity="0.16" stroke="#3DDC84" stroke-opacity="0.5" stroke-width="2"/>
    <text x="112" y="205" font-family="JetBrains Mono, Fira Code, monospace" font-size="18" font-weight="700" fill="#8CF2BA">MyApp/</text>
    <text x="250" y="205" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="16" fill="#9FB8C2">প্রজেক্টের মূল ফোল্ডার</text>

    <!-- level 1 -->
    <rect x="126" y="234" width="964" height="46" rx="10" fill="#3DDC84" fill-opacity="0.22" stroke="#3DDC84" stroke-opacity="0.7" stroke-width="2"/>
    <text x="148" y="263" font-family="JetBrains Mono, Fira Code, monospace" font-size="18" font-weight="700" fill="#8CF2BA">app/</text>
    <text x="250" y="263" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="16" fill="#F3F7F8">অ্যাপের সবকিছু এখানে — কোড খুঁজতে সোজা এখানে আসুন</text>

    <!-- level 2 -->
    <rect x="162" y="292" width="928" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#7FA6B0" stroke-opacity="0.35" stroke-width="2"/>
    <text x="184" y="321" font-family="JetBrains Mono, Fira Code, monospace" font-size="18" fill="#F3F7F8">manifests/</text>
    <text x="360" y="321" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="16" fill="#9FB8C2">AndroidManifest.xml — অ্যাপের পরিচয়পত্র</text>

    <rect x="162" y="350" width="928" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#7FA6B0" stroke-opacity="0.35" stroke-width="2"/>
    <text x="184" y="379" font-family="JetBrains Mono, Fira Code, monospace" font-size="18" fill="#F3F7F8">java/</text>
    <text x="360" y="379" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="16" fill="#9FB8C2">সব Java কোড — এখানেই MainActivity.java</text>

    <rect x="162" y="408" width="928" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#7FA6B0" stroke-opacity="0.35" stroke-width="2"/>
    <text x="184" y="437" font-family="JetBrains Mono, Fira Code, monospace" font-size="18" fill="#F3F7F8">res/</text>
    <text x="360" y="437" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="16" fill="#9FB8C2">layout · drawable · values · mipmap — অ্যাপের চেহারা</text>

    <!-- level 1 again -->
    <rect x="126" y="466" width="964" height="46" rx="10" fill="#F5A94E" fill-opacity="0.14" stroke="#F5A94E" stroke-opacity="0.55" stroke-width="2"/>
    <text x="148" y="495" font-family="JetBrains Mono, Fira Code, monospace" font-size="18" font-weight="700" fill="#F5A94E">Gradle Scripts</text>
    <text x="360" y="495" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="16" fill="#9FB8C2">build.gradle — কোন লাইব্রেরি, কোন Android ভার্সন</text>

    <!-- summary -->
    <rect x="90" y="546" width="1000" height="86" rx="12" fill="#3DDC84" fill-opacity="0.10" stroke="#3DDC84" stroke-opacity="0.45" stroke-width="2"/>
    <text x="116" y="580" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="17" font-weight="700" fill="#8CF2BA">একটি সূত্র মনে রাখলেই যথেষ্ট</text>
    <text x="116" y="610" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="16" fill="#F3F7F8">কোড java/ তে · চেহারা res/ এ · পরিচয় manifests/ এ · নির্দেশনা build.gradle এ — সব app/ ফোল্ডারের ভেতরে।</text>

    <rect x="0" y="0" width="1200" height="4" fill="#3DDC84" fill-opacity="0.6"/>
  </g>
</svg>
