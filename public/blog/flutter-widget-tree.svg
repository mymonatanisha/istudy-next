<svg width="1200" height="675" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F33"/>
      <stop offset="55%" stop-color="#071019"/>
      <stop offset="100%" stop-color="#050C13"/>
    </linearGradient>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#7FA6B0" opacity="0.14"/>
    </pattern>

    <clipPath id="canvasClip">
      <rect width="1200" height="675" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <rect width="1200" height="675" fill="url(#bgGrad)"/>
    <rect width="1200" height="675" fill="url(#dotGrid)"/>

    <!-- ===== title ===== -->
    <rect x="80" y="52" width="46" height="6" rx="3" fill="#F5A94E"/>
    <text x="80" y="104" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="36" font-weight="700" fill="#F3F7F8">Flutter Widget Tree</text>
    <text x="80" y="136" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="19" fill="#9FB8C2">পর্দার প্রতিটি অংশ Widget — বাইরে থেকে ভেতরে স্তরে স্তরে</text>

    <!-- ===== MaterialApp (outer) ===== -->
    <rect x="90" y="170" width="1020" height="430" rx="18"
          fill="#22D3D9" fill-opacity="0.05" stroke="#22D3D9" stroke-opacity="0.45" stroke-width="2"/>
    <text x="115" y="206" font-family="JetBrains Mono, Fira Code, monospace" font-size="22" font-weight="700"
          fill="#5FEFF4">MaterialApp</text>
    <text x="1090" y="206" text-anchor="end" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="17" fill="#7FA6B0">পুরো অ্যাপের ভিত্তি</text>

    <!-- ===== Scaffold (inner) ===== -->
    <rect x="140" y="240" width="920" height="330" rx="14"
          fill="#22D3D9" fill-opacity="0.06" stroke="#22D3D9" stroke-opacity="0.4" stroke-width="2"/>
    <text x="165" y="274" font-family="JetBrains Mono, Fira Code, monospace" font-size="20" font-weight="700"
          fill="#5FEFF4">Scaffold</text>
    <text x="1040" y="274" text-anchor="end" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="17" fill="#7FA6B0">পর্দার কাঠামো</text>

    <!-- ===== AppBar ===== -->
    <rect x="190" y="300" width="820" height="64" rx="10"
          fill="#F5A94E" fill-opacity="0.10" stroke="#F5A94E" stroke-opacity="0.55" stroke-width="2"/>
    <text x="600" y="340" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="20"
          font-weight="700" fill="#F5A94E">AppBar</text>

    <!-- ===== Body ===== -->
    <rect x="190" y="386" width="820" height="154" rx="10"
          fill="#22D3D9" fill-opacity="0.06" stroke="#22D3D9" stroke-opacity="0.4" stroke-width="2"/>
    <text x="215" y="414" font-family="JetBrains Mono, Fira Code, monospace" font-size="18" font-weight="700"
          fill="#5FEFF4">Body</text>

    <!-- leaf widgets -->
    <rect x="215" y="436" width="250" height="72" rx="10"
          fill="#22D3D9" fill-opacity="0.14" stroke="#22D3D9" stroke-opacity="0.5" stroke-width="2"/>
    <text x="340" y="479" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="18"
          fill="#DCE9EC">Text</text>

    <rect x="490" y="436" width="250" height="72" rx="10"
          fill="#22D3D9" fill-opacity="0.14" stroke="#22D3D9" stroke-opacity="0.5" stroke-width="2"/>
    <text x="615" y="479" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="18"
          fill="#DCE9EC">Container</text>

    <rect x="765" y="436" width="220" height="72" rx="10"
          fill="#22D3D9" fill-opacity="0.14" stroke="#22D3D9" stroke-opacity="0.5" stroke-width="2"/>
    <text x="875" y="479" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="18"
          fill="#DCE9EC">ListView</text>

    <!-- connector ticks from Body down to leaf widgets -->
    <g stroke="#22D3D9" stroke-opacity="0.3" stroke-width="2" fill="none">
      <line x1="340" y1="422" x2="340" y2="436"/>
      <line x1="615" y1="422" x2="615" y2="436"/>
      <line x1="875" y1="422" x2="875" y2="436"/>
    </g>

    <!-- ===== footer note ===== -->
    <text x="600" y="648" text-anchor="middle" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="18" fill="#7FA6B0">নেস্টিং যত গভীর, UI তত বিস্তারিত — Flutter-এ অ্যাপ গড়ে ওঠে এভাবেই</text>

    <!-- top hairline accent -->
    <rect x="0" y="0" width="1200" height="4" fill="#22D3D9" fill-opacity="0.6"/>
  </g>
</svg>
