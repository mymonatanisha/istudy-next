<svg width="1600" height="900" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F33"/>
      <stop offset="55%" stop-color="#071019"/>
      <stop offset="100%" stop-color="#050C13"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3D9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3D9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="statGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5FEFF4"/>
      <stop offset="100%" stop-color="#159AA0"/>
    </linearGradient>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#7FA6B0" opacity="0.16"/>
    </pattern>

    <clipPath id="canvasClip">
      <rect width="1200" height="630" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- base background -->
    <rect width="1200" height="630" fill="url(#bgGrad)"/>
    <rect width="1200" height="630" fill="url(#dotGrid)"/>

    <!-- ambient glow behind hero stat -->
    <circle cx="905" cy="330" r="330" fill="url(#glowCyan)"/>

    <!-- ===== background signature motif: widget-tree graph ===== -->
    <g stroke="#22D3D9" stroke-opacity="0.22" stroke-width="2" fill="none">
      <line x1="760" y1="120" x2="760" y2="185"/>
      <line x1="760" y1="185" x2="660" y2="250"/>
      <line x1="760" y1="185" x2="860" y2="250"/>
      <line x1="660" y1="250" x2="600" y2="320"/>
      <line x1="660" y1="250" x2="705" y2="320"/>
      <line x1="860" y1="250" x2="820" y2="320"/>
      <line x1="860" y1="250" x2="930" y2="320"/>
    </g>
    <g fill="#22D3D9" fill-opacity="0.85">
      <rect x="748" y="100" width="24" height="24" rx="6"/>
      <rect x="648" y="238" width="24" height="24" rx="6"/>
      <rect x="848" y="238" width="24" height="24" rx="6"/>
    </g>
    <g fill="#F5A94E" fill-opacity="0.8">
      <rect x="588" y="308" width="20" height="20" rx="5"/>
      <rect x="693" y="308" width="20" height="20" rx="5"/>
      <rect x="808" y="308" width="20" height="20" rx="5"/>
      <rect x="918" y="308" width="20" height="20" rx="5"/>
    </g>

    <!-- ghosted code line, tying to the blog's code section -->
    <text x="600" y="560" font-family="JetBrains Mono, Fira Code, monospace" font-size="34"
          fill="#7FA6B0" fill-opacity="0.14" letter-spacing="1">
      runApp(const EnamNotesApp());
    </text>

    <!-- ===== left column: eyebrow + headline ===== -->
    <rect x="80" y="96" width="46" height="6" rx="3" fill="#F5A94E"/>
    <text x="80" y="140" font-family="Poppins, Inter, sans-serif" font-size="22" font-weight="700"
          letter-spacing="3" fill="#F5A94E">ENAM NOTES</text>
    <text x="80" y="168" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="20" fill="#7FA6B0">Flutter App Development কোর্স</text>

    <text x="78" y="255" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="58" font-weight="700" fill="#F3F7F8">কেন Flutter</text>
    <text x="78" y="322" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="58" font-weight="700" fill="#F3F7F8">শিখবেন?</text>

    <text x="80" y="368" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="24" fill="#9FB8C2">২০২৬ সালে সংখ্যাগুলো যা বলছে</text>

    <!-- flutter mark + course label, bottom-left -->
    <g transform="translate(80, 500)">
      <path d="M4 0 L34 30 L20 44 L-10 14 Z" fill="#22D3D9"/>
      <path d="M14 24 L34 44 L20 58 L0 40 Z" fill="#F5A94E"/>
      <text x="56" y="24" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="22" font-weight="600"
            fill="#F3F7F8">Dart • Flutter • মডিউল ০১</text>
      <text x="56" y="50" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
            font-size="18" fill="#7FA6B0">বাংলায়, বিগিনারদের জন্য</text>
    </g>

    <!-- ===== right side: hero stat ===== -->
    <text x="1120" y="330" text-anchor="end" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="220" font-weight="700" fill="url(#statGrad)">৪৬%</text>
    <rect x="905" y="352" width="215" height="8" rx="4" fill="#F5A94E"/>
    <text x="1120" y="400" text-anchor="end" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="24" fill="#DCE9EC">ক্রস-প্ল্যাটফর্ম মার্কেট শেয়ার</text>
    <text x="1120" y="432" text-anchor="end" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
          font-size="18" fill="#7FA6B0">React Native-এর চেয়ে এগিয়ে (৩৫%)</text>

    <!-- site url, bottom-right -->
    <text x="1120" y="565" text-anchor="end" font-family="Poppins, Inter, sans-serif" font-size="18"
          letter-spacing="1" fill="#5A7986">enamnotes.com</text>

    <!-- top hairline accent -->
    <rect x="0" y="0" width="1200" height="4" fill="#22D3D9" fill-opacity="0.6"/>
  </g>
</svg>
